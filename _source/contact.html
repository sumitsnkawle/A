<!-- Content of the "Contact" page (its <main>). tools/build_pages.py wraps it in the site header, footer and scripts. -->
<!-- Page header -->
<section class="dark relative overflow-hidden pt-28 pb-14 lg:pt-36 lg:pb-20">
  <div class="absolute inset-0 bg-grid-dark pointer-events-none [mask-image:radial-gradient(80%_70%_at_50%_0%,#000_40%,transparent_100%)]"></div>
  <div class="absolute -top-48 right-[-10%] w-[620px] h-[620px] rounded-full bg-[#1764d1]/25 blur-[140px] pointer-events-none"></div>
  <div class="absolute -bottom-64 -left-40 w-[520px] h-[520px] rounded-full bg-[#14b8a6]/15 blur-[140px] pointer-events-none"></div>
  <div class="relative wrap">
    <p class="eyebrow mb-5" data-i18n="contact.kicker"></p>
    <h1 class="font-display text-[2.3rem] sm:text-5xl lg:text-[3.4rem] font-extrabold leading-[1.08] text-white tracking-tight max-w-4xl" data-i18n="cta.title"></h1>
    <p class="mt-6 text-lg text-[#a9b8cc] leading-relaxed max-w-3xl" data-i18n="cta.desc"></p>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="section-pad bg-soft border-y border-[var(--line)]">
  <div class="wrap grid lg:grid-cols-12 gap-12 lg:gap-16">
    <div class="lg:col-span-5 fade-up" data-fade>
      <p class="text-[var(--body)] leading-relaxed" data-i18n="contact.desc">Demo requests, partnership inquiries and investor conversations all start here.</p>
      <div class="mt-8 space-y-4">
        <a href="mailto:info@axionast.com" class="flex items-center gap-4 group">
          <span class="ico"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
          <span class="text-[var(--ink)] font-semibold group-hover:text-[var(--brand)] transition">info@axionast.com</span>
        </a>
        <a href="https://axionast.com" class="flex items-center gap-4 group">
          <span class="ico"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></span>
          <span class="text-[var(--ink)] font-semibold group-hover:text-[var(--brand)] transition">axionast.com</span>
        </a>
      </div>
    </div>
    <div class="lg:col-span-7">
      <form id="contactForm" class="card p-6 sm:p-8 grid sm:grid-cols-2 gap-4 shadow-[0_30px_60px_-40px_rgba(11,29,54,.4)] fade-up" data-fade action="https://formsubmit.co/ajax/info@axionast.com" method="POST">
        <input type="hidden" name="_subject" value="New inquiry from Axion Regulus website">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="text" name="_honey" class="hidden" tabindex="-1" autocomplete="off">
        <input required name="Name" type="text" placeholder="Full name" data-i18n-placeholder="contact.name" class="rounded-lg px-4 py-3 text-sm sm:col-span-1">
        <input required name="Email" type="email" placeholder="Work email" data-i18n-placeholder="contact.email" class="rounded-lg px-4 py-3 text-sm sm:col-span-1">
        <input name="Company" type="text" placeholder="Company" data-i18n-placeholder="contact.company" class="rounded-lg px-4 py-3 text-sm sm:col-span-2">
        <input name="Industry" type="text" placeholder="Industry" data-i18n-placeholder="contact.industry" class="rounded-lg px-4 py-3 text-sm sm:col-span-1">
        <input name="Regulatory framework / country" type="text" placeholder="Regulatory framework / country (optional)" data-i18n-placeholder="contact.framework" class="rounded-lg px-4 py-3 text-sm sm:col-span-1">
        <select name="Inquiry Type" class="rounded-lg px-4 py-3 text-sm sm:col-span-2">
          <option class="bg-white text-slate-900" data-i18n="contact.opt1">I'd like to request a demo</option>
          <option class="bg-white text-slate-900" data-i18n="contact.opt2">I'm interested in partnership</option>
          <option class="bg-white text-slate-900" data-i18n="contact.opt3">I'm an investor / venture partner</option>
          <option class="bg-white text-slate-900" data-i18n="contact.opt4">General inquiry</option>
        </select>
        <textarea name="What would you like to validate" placeholder="What would you like to check? (e.g. supplement labels, cosmetic product pages, food ads)" data-i18n-placeholder="contact.validate" rows="2" class="rounded-lg px-4 py-3 text-sm sm:col-span-2"></textarea>
        <textarea name="Message" placeholder="Tell us about your products and markets" data-i18n-placeholder="contact.message" rows="4" class="rounded-lg px-4 py-3 text-sm sm:col-span-2"></textarea>
        <button type="submit" class="btn btn-primary sm:col-span-2 disabled:opacity-60 disabled:cursor-not-allowed" data-i18n="contact.submit">Send inquiry</button>
        <p data-status class="text-sm sm:col-span-2 text-center"></p>
        <p class="text-[11px] text-slate-400 sm:col-span-2 text-center" data-i18n="contact.privacy">We use your information only to respond to your inquiry. See our Privacy Policy.</p>
      </form>
    </div>
  </div>
</section>
